<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>알밤보드</title>
<meta name="description" content="세훈이 육아 기록부터 집안 관리까지, 거실 보드">
<meta name="theme-color" content="#0e0b09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Pretendard-SemiBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="shift">
    <!-- 쪽: [시계] ← [대시보드] → [타임라인] → [통계]. 옆으로 밀거나 아래 점을 눌러 넘긴다(src/ui/pages.js) -->
    <!-- 시계: 지금 시각, 날짜·요일 크게(src/ui/clock-page.js) -->
    <div class="page hidden" id="pageClock">
      <div class="box" id="bigClock"></div>
      <div class="box t24" id="bigDate"></div>
      <div class="box" id="bigAge"></div>   <!-- D+143 · 4개월 21일 · 교정 3개월 29일 -->
    </div>

    <!-- 대시보드(처음 쪽): 위층 = 알밤 + 말풍선(가장 급한 항목 하나), 아래층 = 수유·기저귀·잠 큰 버튼 셋(상태를 버튼 안에).
         배치 규칙은 styles/app.css '대시보드', 말풍선·표정 규칙은 src/ui/status.js 의 chooseFocus.
         아래층(수유·기저귀·잠 상태를 담은 큰 버튼)은 모든 쪽에 있는 #actions 가 대시보드에서 커진 것 -->
    <div class="page" id="pageMain">
      <div id="albam" class="spr box"></div>
      <!-- 오른쪽 위 구석: 2026년 11월 6일 금요일 14:00 / D+142 · 4개월 20일 · 교정 3개월 28일(시각과 헷갈리지 않게 나이는 아랫줄).
           좁은 화면(P4)에서는 쪽 점과 안 겹치게 해를 뺀다. 못 보낸 기록·연결 끊김은 문제 있을 때만 맨 왼쪽에 -->
      <div class="box" id="corner"><span id="net" class="t9"></span><span id="today2" class="dim"></span><span id="clock" class="val"></span></div>
      <div class="box t9" id="ageLine"></div>
      <!-- 말풍선: 상태 문구 / 그 항목의 지난 시간(가장 큰 글씨) / 이름표. 꼬리는 알밤 쪽(왼쪽) -->
      <div class="box" id="bubble">
        <div id="bubbleText"></div>
        <div id="elapsed"></div>
        <div id="bubbleLabel"></div>
      </div>
      <!-- 마이크: [+] 위에 작게(호출어가 생기면 뺄 예정) -->
      <button class="px square box" id="micBtn" aria-label="호출어 꺼짐(누르면 켬)" title="호출어 꺼짐(누르면 켬)"><span class="spr ico x2 ico-mic"></span></button>
    </div>

    <!-- 타임라인: 최근 3일을 0~24시 줄로(src/ui/timeline.js) -->
    <div class="page hidden" id="pageTimeline">
      <div class="box t9" id="timelineHead">
        <span class="dim t12">타임라인</span>
        <span class="lg feed"></span><span>수유</span><span class="lg sleep"></span><span>잠</span>
        <span class="lg pee"></span><span>소변</span><span class="lg poo"></span><span>대변</span>
        <span id="timelineNote" class="warn"></span>
        <span id="todayBox"><span id="today"></span><span id="demoNote" class="faint"></span></span>   <!-- 오늘 3회 · 570ml · 미리 보기 -->
      </div>
      <div class="box t9" id="timelineAxis">
        <span style="left:40px">0</span><span style="left:115px">6</span><span style="left:190px">12</span><span style="left:265px">18</span><span style="left:340px">24</span>
      </div>
      <div class="box" id="timelineRows"></div>
    </div>

    <!-- 통계: 최근 7일 날짜 카드(src/ui/stats.js) -->
    <div class="page hidden" id="pageStats">
      <div class="box" id="statsHead">
        <span id="statsLegend" class="t9"></span><span id="statsNote" class="t9 warn"></span>
        <div id="statsTabs">
          <button class="px on" data-metric="feed">수유</button>
          <button class="px" data-metric="diaper">기저귀</button>
          <button class="px" data-metric="sleep">잠</button>
        </div>
      </div>
      <div class="box" id="statsChart"></div>   <!-- 날짜별 막대 일곱 개 -->
      <div class="box" id="statsFoot"></div>    <!-- 지난 6일 평균 -->
    </div>
    <!-- 쪽 표시: 점 하나 = 쪽 하나(누르면 그 쪽으로) -->
    <div class="box" id="pageDots"></div>

    <!-- 기록 버튼: [수유] [기저귀] [잠] [+]. 모든 쪽 아래(높이 30, 이름만)에 있고, 대시보드에서는 상태를 안에 담은 큰 버튼이 된다
         (이름 / 지난 시간 크게 / 시각·세부 작게). [잠]은 누르면 잠 시작, 자는 중이면 "깼어요"로 바뀌어 누르면 끝 -->
    <div class="box cols" id="actions">
      <button class="px action rec" id="feedBtn"><span class="rLbl"><span class="spr ico x2 ico-bottle"></span><span id="feedBtnText">수유</span><span class="rMore"></span></span><span class="rBig"></span><span class="rSub"></span></button>
      <button class="px action rec" id="diaperBtn"><span class="rLbl"><span class="spr ico x2 ico-diaper"></span><span>기저귀</span><span class="rMore"></span></span><span class="rBig"></span><span class="rSub"></span></button>
      <button class="px action rec" id="sleepBtn" aria-label="잠들었어요" title="잠"><span class="rLbl"><span class="spr ico x2 ico-moon"></span><span id="sleepBtnText">잠</span><span class="rMore"></span></span><span class="rBig"></span><span class="rSub"></span></button>
      <button class="px action square" id="lateBtn" aria-label="더보기: 목욕·체온·투약… 지난 기록 넣기" title="더보기"><span class="spr ico x2 ico-plus"></span></button>
    </div>
    <div class="box hidden" id="notice"></div>   <!-- 저장·취소 결과 알림(잠깐) -->
    <div class="box hidden" id="undo">
      <div id="undoMsg"><span class="spr ico ico-check"></span><span id="undoText">저장됨</span></div>
      <button class="px" id="undoBtn">취소 <span id="undoCount"></span></button>
    </div>

    <!-- 수유량 고르기 -->
    <div class="sheet hidden" id="feedSheet">
      <h2>수유량(완성량) · 지금</h2>
      <button class="px ghost" id="amountEditBtn">빠른 선택 바꾸기</button>
      <div class="row" id="amountRow"></div>     <!-- 빠른 선택: 200 / 브레짜 180 … -->
      <div class="row" id="stepRow"></div>       <!-- [-10] [-30 브레짜] 200ml·브레짜 180 [+30 브레짜] [+10] -->
      <div class="foot">
        <button class="px ghost" data-close>닫기</button>
        <button class="px" id="feedSave">지금 저장</button>          <!-- 걸린 시간 없이 바로 -->
        <button class="px main acc" id="feedStart">먹이기 시작</button>  <!-- 다 먹이면 [수유] 버튼이 [다 먹음] -->
      </div>
    </div>

    <!-- 수유량 설정: 빠른 선택 세 개 -->
    <div class="sheet hidden" id="amountSheet">
      <h2>수유량 빠른 선택 바꾸기 · 모든 기기에 같이 적용</h2>
      <div id="amountSlots"></div>
      <div id="amountMsg" class="t9 warn"></div>
      <div class="foot">
        <button class="px ghost" id="amountCancel">취소</button>
        <button class="px main acc" id="amountSave">저장</button>
      </div>
    </div>

    <!-- 기저귀 -->
    <div class="sheet hidden" id="diaperSheet">
      <h2>기저귀 · 지금</h2>
      <div class="choices">
        <button class="px" data-type="pee">소변</button>
        <button class="px" data-type="poo">대변</button>
        <button class="px" data-type="both">둘 다</button>
      </div>
      <div class="foot"><button class="px ghost" data-close>닫기</button></div>
    </div>

    <!-- 비슷한 기록 확인 -->
    <div class="sheet hidden" id="confirmSheet">
      <h2>확인</h2>
      <div id="confirmText" class="t12"></div>
      <div class="foot">
        <button class="px ghost" id="confirmNo">안 넣기</button>
        <button class="px main acc" id="confirmYes">그래도 저장</button>
      </div>
    </div>

    <!-- 음성 -->
    <div class="sheet hidden" id="voiceSheet">
      <h2 id="voiceTitle">듣는 중…</h2>
      <div id="voiceLabel" class="t24"></div>
      <div id="voiceRaw"></div>
      <div id="voiceBar"><div id="voiceBarFill"></div></div>
      <div class="foot" id="voiceFoot">
        <button class="px ghost" id="voiceCancel">취소</button>
        <button class="px main hidden" id="voiceRetry">다시 말하기</button>
      </div>
    </div>

    <!-- 지난 기록 넣기 -->
    <div class="sheet hidden" id="lateSheet">
      <h2 id="lateTitle">지난 기록 넣기</h2>
      <div class="kinds">
        <button class="px ghost hidden" id="lateFeedEnd">끝 시각</button>   <!-- 수유·목욕 등: 끝 시각도 넣기 -->
        <button class="px on hidden" id="lateKindOther"></button>          <!-- 목욕·체온 등(기록 종류 표) -->
        <button class="px" data-kind="feed">수유</button>
        <button class="px" data-kind="diaper">기저귀</button>
        <button class="px" data-kind="sleep">잠</button>
      </div>
      <!-- 시각: 날짜·시·분 바퀴(굴리기, 위아래 누르기, 가운데 누르면 직접 입력). 잠은 시작·끝 두 묶음 -->
      <div id="lateTimes"></div>
      <input type="time" id="lateTimeInput" tabindex="-1" aria-hidden="true">
      <div class="row" id="lateDetail"></div>
      <div class="foot">
        <button class="px ghost" data-close>닫기</button>
        <button class="px ghost" id="recentBtn">오늘 기록</button>
        <button class="px ghost hidden" id="lateDelete">지우기</button>
        <button class="px main acc" id="lateSave">저장</button>
      </div>
    </div>

    <!-- [+] 더보기: 기록 종류 표(in_more)의 종류 + 지난 기록 넣기·오늘 기록(src/ui/more.js) -->
    <div class="sheet hidden" id="moreSheet">
      <h2>기록 더하기</h2>
      <div id="moreGrid"></div>
      <div class="foot">
        <button class="px ghost" data-close>닫기</button>
        <button class="px ghost" id="moreToday">오늘 기록</button>
        <button class="px main" id="moreLate">지난 기록 넣기</button>
      </div>
    </div>

    <!-- 그날 기록 목록: 줄을 누르면 고치기(src/ui/day-list.js). 위아래로 끌어 넘긴다 -->
    <div class="sheet hidden" id="recentSheet">
      <h2 id="recentTitle">오늘 기록</h2>
      <div id="recentList"></div>
      <div class="foot">
        <button class="px ghost" data-close>닫기</button>
        <button class="px ghost" id="dayPrev">◀ 전날</button>
        <button class="px ghost" id="dayNext">다음날 ▶</button>
      </div>
    </div>

    <!-- 로그인 -->
    <div class="sheet hidden" id="loginSheet">
      <h2>알밤보드 로그인 (가족 계정)</h2>
      <form id="loginForm" autocomplete="on">
        <div id="setupFields" class="hidden">
          <div class="row">
            <div class="grow"><label for="cfgUrl">Supabase URL</label><input id="cfgUrl" type="url" placeholder="https://xxxx.supabase.co"></div>
            <div class="grow"><label for="cfgKey">anon key</label><input id="cfgKey" type="text" autocomplete="off"></div>
          </div>
        </div>
        <div class="row">
          <div class="grow"><label for="email">이메일</label><input id="email" type="email" autocomplete="username"></div>
          <div class="grow"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password"></div>
        </div>
        <div id="loginMsg"></div>
        <div class="foot">
          <a class="px-btn px ghost" href="?demo" style="text-decoration:none;flex:1;height:32px">미리 보기(demo)</a>
          <button class="px main acc" type="submit" id="loginBtn">로그인</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 밤 화면 -->
  <div id="night" class="hidden"><div id="nightText"></div></div>
</div></div>

<script src="config.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
